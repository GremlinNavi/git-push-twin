stages:
  - test

powershell-syntax:
  stage: test
  # Microsoft documents the .NET SDK container as including PowerShell for testing.
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - pwsh -NoLogo -NoProfile -File ./tests/Parse-PowerShell.ps1

# Network-changing twin operations are intentionally excluded from CI.
# Integration tests should use disposable local/bare repositories or explicit test fixtures.
